# Local-only boundary. Do not directly publish these ports; put HTTPS and an access policy in front of the portals.
# Officers sign in with email and password (provision: docker compose exec api python scripts/officer_accounts.py
# create EMAIL "NAME" --password-stdin). Legacy pasted officer tokens are OFF here (AGRIREACH_LEGACY_OFFICER_TOKENS).
# The API port must stay reachable by the portals only: it trusts their per-browser client header for rate limits.
x-common: &common
  build: .
  restart: unless-stopped
  environment: &common-env
    DATABASE_URL: sqlite:////var/lib/agrireach/agrireach.db
    AGRIREACH_SIMULATOR: "0"
    SMS_ENABLED: "0"
    WHATSAPP_ENABLED: "0"
    AGRIREACH_RAINFALL: "off"
    AGRIREACH_SOURCE_CHECK: "0"
    AGRIREACH_STT: "none"
    AGRIREACH_MEDIA_DIR: /var/lib/agrireach/media
    AGRIREACH_OUTBOX: /var/lib/agrireach/outbox
    LLM_BASE_URL: ""
    LLM_MODEL: ""
    LLM_API_KEY: ""
    AGRIREACH_JUDGE_BASE_URL: ""
    AGRIREACH_JUDGE_API_KEY: ""
    AGRIREACH_LEGACY_OFFICER_TOKENS: "${AGRIREACH_LEGACY_OFFICER_TOKENS:-0}"
    AGRIREACH_OFFICER_SESSION_HOURS: "${AGRIREACH_OFFICER_SESSION_HOURS:-8}"
    AGRIREACH_LOGIN_MAX_FAILURES: "${AGRIREACH_LOGIN_MAX_FAILURES:-5}"
    AGRIREACH_LOGIN_WINDOW_SECONDS: "${AGRIREACH_LOGIN_WINDOW_SECONDS:-900}"
    AGRIREACH_SUBMIT_LIMIT: "${AGRIREACH_SUBMIT_LIMIT:-10}"
    AGRIREACH_SUBMIT_WINDOW_SECONDS: "${AGRIREACH_SUBMIT_WINDOW_SECONDS:-600}"
    AGRIREACH_FARMER_SESSION_HOURS: "${AGRIREACH_FARMER_SESSION_HOURS:-24}"
    AGRIREACH_TRUST_PORTAL_CLIENT_HEADER: "1"
  volumes:
    - demo_data:/var/lib/agrireach

services:
  api:
    <<: *common
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  farmer:
    <<: *common
    command: ["python", "-m", "streamlit", "run", "src/agrireach/farmer_ui.py", "--server.address", "0.0.0.0", "--server.port", "8501", "--server.headless", "true", "--browser.gatherUsageStats", "false"]
    environment:
      <<: *common-env
      AGRIREACH_API: http://api:8000
    ports:
      - "127.0.0.1:8501:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      api:
        condition: service_healthy

  officer:
    <<: *common
    command: ["python", "-m", "streamlit", "run", "src/agrireach/officer_ui.py", "--server.address", "0.0.0.0", "--server.port", "8502", "--server.headless", "true", "--browser.gatherUsageStats", "false"]
    environment:
      <<: *common-env
      AGRIREACH_API: http://api:8000
    ports:
      - "127.0.0.1:8502:8502"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8502/_stcore/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      api:
        condition: service_healthy

volumes:
  demo_data:
